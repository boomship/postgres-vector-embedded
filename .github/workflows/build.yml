name: Build PostgreSQL + pgvector + pg_trgm

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write  # Required for creating releases

jobs:
  build:
    strategy:
      fail-fast: false  # Don't stop other builds if one fails
      matrix:
        include:
          # Lite variants (all platforms)
          - os: macos-26
            platform: darwin
            arch: arm64
            variant: lite
          - os: macos-26-intel
            platform: darwin  
            arch: x64
            variant: lite
          - os: ubuntu-latest
            platform: linux
            arch: x64
            variant: lite
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            variant: lite
          - os: windows-latest
            platform: win32
            arch: x64
            variant: lite
          # Full variants (macOS and Linux only)
          - os: macos-26
            platform: darwin
            arch: arm64
            variant: full
          - os: macos-26-intel
            platform: darwin  
            arch: x64
            variant: full
          - os: ubuntu-latest
            platform: linux
            arch: x64
            variant: full
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            variant: full

    runs-on: ${{ matrix.os }}
    
    defaults:
      run:
        shell: ${{ matrix.os == 'windows-latest' && 'bash' || 'bash' }}
    
    steps:
    - uses: actions/checkout@v7.0.1
    
    - uses: actions/setup-node@v7.0.0
      with:
        node-version: '26'


    - name: Install dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        if [ "${{ matrix.arch }}" = "arm64" ]; then
          # Build natively in the compatibility container below.
          echo "Using native ARM64 runner with Ubuntu 22.04 container"
        else
          sudo apt-get install -y build-essential bison flex pkg-config zlib1g-dev libreadline-dev libssl-dev libicu-dev liblz4-dev libzstd-dev libxml2-dev llvm-dev uuid-dev clang
        fi

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install bison flex pkgconf openssl readline icu4c lz4 zstd libxml2 llvm e2fsprogs
        echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"

    - name: Install dependencies (Windows)
      if: runner.os == 'Windows'
      run: |
        echo "=== Windows dependency installation starting ==="
        
        # Install only essential build tools - no OpenSSL for now
        echo "Installing winflexbison3..."
        choco install winflexbison3
        
        # Add bison/flex to PATH
        toolsPath="/c/ProgramData/chocolatey/lib/winflexbison3/tools"
        echo "$toolsPath" >> $GITHUB_PATH
        
        # Create symlinks if needed
        if [ -f "$toolsPath/win_bison.exe" ]; then
          ln -s "$toolsPath/win_bison.exe" "$toolsPath/bison.exe"
        fi
        if [ -f "$toolsPath/win_flex.exe" ]; then
          ln -s "$toolsPath/win_flex.exe" "$toolsPath/flex.exe"
        fi
        
        echo "=== Windows dependency installation complete (minimal build) ==="


    - name: Test Node package
      run: npm ci && npm test && npm run lint

    - name: Get version from package.json
      id: version
      shell: bash
      run: |
        VERSION=$(node -p "require('./package.json').version")
        if [ "${{ github.event_name }}" == "pull_request" ]; then
          VERSION="$VERSION-pr-${{ github.event.number }}"
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Building version: $VERSION"

    - name: Build PostgreSQL + pgvector + pg_trgm (Windows)
      if: runner.os == 'Windows'
      run: |
        export PLATFORM=${{ matrix.platform }}
        export ARCH=${{ matrix.arch }}
        export VARIANT=${{ matrix.variant }}
        make build

    - name: Build PostgreSQL + pgvector + pg_trgm (native ARM64 container)
      if: runner.os == 'Linux' && matrix.arch == 'arm64'
      run: |
        docker run --rm --platform linux/arm64 \
          -v ${{ github.workspace }}:/workspace \
          -w /workspace \
          ubuntu:22.04 bash -c "
            apt-get update && 
            apt-get install -y build-essential curl make bison flex zlib1g-dev libreadline-dev libssl-dev libicu-dev liblz4-dev libzstd-dev libxml2-dev llvm-dev uuid-dev clang pkg-config &&
            export PLATFORM=${{ matrix.platform }} &&
            export ARCH=${{ matrix.arch }} &&
            export VARIANT=${{ matrix.variant }} &&
            make build
          "

    - name: Build PostgreSQL + pgvector + pg_trgm (Unix)
      if: runner.os != 'Windows' && !(runner.os == 'Linux' && matrix.arch == 'arm64')
      shell: bash
      run: |
        export PLATFORM=${{ matrix.platform }}
        export ARCH=${{ matrix.arch }}
        export VARIANT=${{ matrix.variant }}
        make build

    - name: Test binaries functionality (Windows)
      if: runner.os == 'Windows'
      run: |
        export PLATFORM=${{ matrix.platform }}
        export ARCH=${{ matrix.arch }}
        export VARIANT=${{ matrix.variant }}
        ./test-binaries.sh

    - name: Test binaries functionality (native ARM64 container)
      if: runner.os == 'Linux' && matrix.arch == 'arm64'
      run: |
        docker run --rm --platform linux/arm64 \
          -v ${{ github.workspace }}:/workspace \
          -w /workspace \
          ubuntu:22.04 bash -c "
            apt-get update &&
            apt-get install -y libxml2 libssl3 libicu70 liblz4-1 libzstd1 libreadline8 libuuid1 zlib1g llvm-14-runtime clang-14 &&
            adduser --disabled-password --gecos '' testuser &&
            chown -R testuser:testuser /workspace &&
            su testuser -c '
              export PLATFORM=${{ matrix.platform }} &&
              export ARCH=${{ matrix.arch }} &&
              export VARIANT=${{ matrix.variant }} &&
              ./test-binaries.sh
            '
          "

    - name: Test binaries functionality (Unix)
      if: runner.os != 'Windows' && !(runner.os == 'Linux' && matrix.arch == 'arm64')
      shell: bash
      run: |
        export PLATFORM=${{ matrix.platform }}
        export ARCH=${{ matrix.arch }}
        export VARIANT=${{ matrix.variant }}
        ./test-binaries.sh

    - name: Test wrapper with native binaries
      if: runner.os != 'Windows' && !(runner.os == 'Linux' && matrix.arch == 'arm64')
      env:
        TEST_BINARIES_DIR: postgres-dist/postgres-${{ matrix.variant }}-${{ matrix.platform }}-${{ matrix.arch }}
      run: node --test tests/native.test.js

    - name: Upload build artifacts
      uses: actions/upload-artifact@v7.0.1
      with:
        name: postgres-${{ matrix.variant }}-${{ matrix.platform }}-${{ matrix.arch }}
        path: postgres-dist/postgres-${{ matrix.variant }}-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !failure()
    
    steps:
    - uses: actions/checkout@v7.0.1

    - name: Get version from package.json
      id: version
      run: |
        VERSION=$(node -p "require('./package.json').version")
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Download all artifacts
      uses: actions/download-artifact@v8.0.1
      with:
        path: artifacts

    - name: Prepare release assets
      run: |
        mkdir release-assets
        find artifacts -name "*.tar.gz" -exec cp {} release-assets/ \;
        ls -la release-assets/
        
        # Check we have all expected platforms and variants
        expected_files=(
          # Lite variants (all platforms)
          "postgres-lite-darwin-arm64.tar.gz"
          "postgres-lite-darwin-x64.tar.gz" 
          "postgres-lite-linux-x64.tar.gz"
          "postgres-lite-linux-arm64.tar.gz"
          "postgres-lite-win32-x64.tar.gz"
          # Full variants (macOS and Linux only)
          "postgres-full-darwin-arm64.tar.gz"
          "postgres-full-darwin-x64.tar.gz" 
          "postgres-full-linux-x64.tar.gz"
          "postgres-full-linux-arm64.tar.gz"
        )
        
        missing_files=()
        for file in "${expected_files[@]}"; do
          if [ ! -f "release-assets/$file" ]; then
            missing_files+=("$file")
          fi
        done
        
        if [ ${#missing_files[@]} -gt 0 ]; then
          echo "❌ Missing platform builds:"
          printf '%s\n' "${missing_files[@]}"
          echo "This release would be incomplete. Failing."
          exit 1
        fi
        
        echo "✅ All platform builds present"

    - name: Create Release
      uses: softprops/action-gh-release@v3.0.3
      with:
        tag_name: v${{ steps.version.outputs.version }}
        name: v${{ steps.version.outputs.version }}
        body: |
          PostgreSQL + pgvector + pg_trgm embedded binaries
          
          Built from:
          - PostgreSQL 18.6
          - pgvector 0.8.6
          - pg_trgm (bundled with PostgreSQL)
          - pg_upgrade and backup/restore tools
          
          Download the appropriate binary for your platform and architecture.
        files: release-assets/*
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
